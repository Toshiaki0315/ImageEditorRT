name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    # 対象と同じ Apple Silicon の macOS で動かす（ImageIO・ヒラギノを使うテストがあるため）
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Tauri のビルドは画面のビルド結果（dist/）を必要とする
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build-app:
    # macOS アプリ (.app) がビルドできることを確かめる
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tauri build --bundles app
      - run: test -x target/release/bundle/macos/ImageEditorRT.app/Contents/MacOS/imageeditorrt
      # 画面を出さずに、画像を読めるかを確かめる（起動確認）
      - run: target/release/bundle/macos/ImageEditorRT.app/Contents/MacOS/imageeditorrt --smoke-test
