<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>ImageEditorRT</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <header class="toolbar">
      <label class="button">開く…<input id="file" type="file" accept="image/*,.heic,.heif" hidden /></label>
      <button id="sample" type="button">計測用の画像（6000×4000）</button>
      <label>受け渡し
        <select id="format">
          <option value="jpeg">JPEG</option>
          <option value="rgba">RGBA のまま</option>
        </select>
      </label>
      <button id="bench" type="button">受け渡しを計測</button>
      <button id="reset" type="button">加工をリセット</button>
      <span id="timing" class="timing"></span>
    </header>
    <main class="layout">
      <section id="stage" class="stage">
        <canvas id="canvas" hidden></canvas>
        <p id="hint" class="hint">画像をドロップするか「開く…」で選んでください</p>
      </section>
      <aside class="side">
        <nav class="tabs">
          <button type="button" class="tab active" data-tab="panel">加工</button>
          <button type="button" class="tab" data-tab="exif">EXIF</button>
        </nav>
        <div id="panel" class="panel"></div>
        <div id="exif" class="panel exif" hidden><p class="empty">画像を開くと EXIF を表示します</p></div>
      </aside>
    </main>
    <footer id="status" class="status"></footer>
  </body>
</html>
