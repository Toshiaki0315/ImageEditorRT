<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>ImageEditorRT</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <main class="layout">
      <section id="stage" class="stage">
        <div id="placeholder" class="placeholder">ここに画像をドロップしてください</div>
        <div class="frame">
          <canvas id="canvas" class="preview" hidden></canvas>
          <!-- トリミング範囲の選択（範囲の外を暗くし、ドラッグで選ぶ） -->
          <svg id="overlay" class="overlay" hidden></svg>
          <!-- ジオラマのピントの帯のガイド（「ジオラマ」タブを開いている間だけ） -->
          <svg id="guide" class="guide" hidden preserveAspectRatio="none" viewBox="0 0 1 1"></svg>
        </div>
        <!-- 100% 表示（表示 > 100% で表示）。ドラッグ・スクロールで動かす -->
        <div id="zoom" class="zoom" hidden>
          <div id="zoom-image" class="zoom-image">
            <canvas id="zoom-canvas"></canvas>
            <svg id="zoom-guide" class="guide" hidden preserveAspectRatio="none" viewBox="0 0 1 1"></svg>
          </div>
        </div>
        <!-- 左上の表示（「加工前」「100%」「更新中…」） -->
        <div id="badge" class="badge" hidden></div>
        <!-- R・G・B・輝度のヒストグラム（表示 > ヒストグラム） -->
        <canvas id="histogram" class="histogram" hidden></canvas>
      </section>
      <aside class="side">
        <nav class="tabs" role="tablist">
          <button type="button" class="tab" role="tab" data-tab="adjust">加工</button>
          <button type="button" class="tab" role="tab" data-tab="crop">切り抜き</button>
          <button type="button" class="tab" role="tab" data-tab="output">出力</button>
          <button type="button" class="tab" role="tab" data-tab="diorama">ジオラマ</button>
          <button type="button" class="tab" role="tab" data-tab="exif">EXIF</button>
        </nav>
        <div id="page-adjust" class="page" role="tabpanel"></div>
        <div id="page-crop" class="page" role="tabpanel" hidden>
          <h2>フレーム・形</h2>
          <label class="row">フレーム <select id="frame"></select></label>
          <label class="row">形 <select id="shape"></select></label>
          <label class="row">
            角丸
            <input id="corner-radius" type="range" min="0" max="50" step="1" title="ダブルクリックで 10% に戻す" />
            <output id="corner-radius-value"></output>
          </label>
          <h2>回転・反転</h2>
          <div class="buttons">
            <button type="button" data-orient="rotate_left">左に回転</button>
            <button type="button" data-orient="rotate_right">右に回転</button>
            <button type="button" data-orient="flip_horizontal">左右反転</button>
            <button type="button" data-orient="flip_vertical">上下反転</button>
          </div>
          <h2>トリミング</h2>
          <label class="row">比 <select id="aspect"></select></label>
          <label class="check"><input id="portrait" type="checkbox" /> 縦向き</label>
          <label class="row">X <input id="crop-x" type="number" min="0" step="1" /><span>px</span></label>
          <label class="row">Y <input id="crop-y" type="number" min="0" step="1" /><span>px</span></label>
          <label class="row">幅 <input id="crop-width" type="number" min="0" step="1" /><span>px</span></label>
          <label class="row">高さ <input id="crop-height" type="number" min="0" step="1" /><span>px</span></label>
          <div class="buttons">
            <button type="button" id="clear-crop">範囲をクリア</button>
            <button type="button" id="trim" aria-pressed="false">トリミング実行</button>
          </div>
          <p class="note">プレビューの画像の上をドラッグして範囲を選べます（範囲の中をドラッグで移動、四隅で大きさを変更、クリックで解除）。</p>
        </div>
        <div id="page-output" class="page" role="tabpanel" hidden>
          <h2>サイズ変更</h2>
          <label class="row">幅 <input id="out-width" type="number" min="1" max="20000" step="1" /><span>px</span></label>
          <label class="row">高さ <input id="out-height" type="number" min="1" max="20000" step="1" /><span>px</span></label>
          <label class="check"><input id="keep-aspect" type="checkbox" checked /> 縦横比を保持</label>
          <h2>保存の設定</h2>
          <label class="row">
            JPEG 品質
            <input id="jpeg-quality" type="range" min="1" max="100" step="1" title="ダブルクリックで 90 に戻す" />
            <output id="jpeg-quality-value"></output>
          </label>
          <label class="check"><input id="keep-exif" type="checkbox" /> 撮影情報 (EXIF) を残す</label>
          <label class="check"><input id="keep-gps" type="checkbox" /> 位置情報 (GPS) も残す</label>
        </div>
        <div id="page-diorama" class="page" role="tabpanel" hidden></div>
        <div id="page-exif" class="page exif" role="tabpanel" hidden></div>
        <div class="actions">
          <button type="button" id="before" disabled title="押している間だけ加工前の画像を表示します（\ キー）">加工前</button>
          <button type="button" id="save" disabled>保存</button>
          <button type="button" id="reset" disabled title="#20 で作ります">リセット</button>
        </div>
      </aside>
    </main>
    <footer id="status" class="status">画像が読み込まれていません</footer>
    <!-- 文字・透かし（開いたまま調整でき、変更はすぐプレビューに反映する） -->
    <dialog id="text-dialog" class="text-dialog">
      <h2>文字・透かし</h2>
      <label class="row">文字 <textarea id="text-input" rows="3" placeholder="入れる文字（例: © 2026 Toshiaki）。改行もできます"></textarea></label>
      <label class="row">フォント <select id="text-font"></select></label>
      <label class="row">大きさ <input id="text-size" type="number" min="1" max="30" step="0.5" /><span>%</span></label>
      <label class="row">色 <input id="text-color" type="color" /></label>
      <label class="row">不透明度 <input id="text-opacity" type="range" min="0" max="100" step="1" /><output id="text-opacity-value"></output></label>
      <label class="row">位置 <select id="text-position"></select></label>
      <p class="note">大きさは写真の短辺に対する % です。「フレームの余白」はポラロイド・チェキの広い余白に入れます（フレームがなければ写真の下中央）。フレームの余白の文字は「トリミング実行」の表示で確認できます。</p>
      <div class="buttons dialog-buttons">
        <button type="button" id="text-clear">文字を消す</button>
        <button type="button" id="text-close">閉じる</button>
      </div>
    </dialog>
  </body>
</html>
