[workspace]
resolver = "2"
members = ["crates/core", "src-tauri"]

[workspace.package]
edition = "2021"
version = "0.9.11"
license = "MIT"

# Tauri の推奨（アプリを小さく・速くする）
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# パニックはそのスレッドの中で止める（unwind）。開く・保存などの処理で想定外のエラーが起きても、
# ログに書いて知らせ、アプリは続ける（panic = "abort" にすると、その場でアプリが終了する）
strip = true

# 開発中も画像処理は速くする（テスト・ベンチマークの時間を短くする）
[profile.dev.package."*"]
opt-level = 3
