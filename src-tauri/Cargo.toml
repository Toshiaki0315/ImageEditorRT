[package]
name = "imageeditorrt"
description = "ImageEditorRT（Tauri のアプリ本体）"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "imageeditorrt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
imageeditorrt-core = { path = "../crates/core" }
image = { version = "0.25", default-features = false }
tauri-plugin-dialog = "2.8.1"
rayon = "1"

# クリップボード（NSPasteboard）・共有の一覧（NSSharingServicePicker）（Tauri がすでに使っている版）
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem", "NSSharingService", "NSView", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSString", "NSURL", "NSGeometry"] }

