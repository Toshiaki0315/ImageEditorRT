[package]
name = "imageeditorrt-core"
description = "ImageEditorRT の画像処理・EXIF（Tauri に依存しない）"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[lib]
name = "imageeditorrt_core"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "rayon"] }
rayon = "1"
ab_glyph = "0.2"
kamadak-exif = "0.6"
jpeg-encoder = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fast_image_resize = { version = "6.1.0", default-features = false, features = ["rayon"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-image-io = "0.3"
# 顔の自動認識（投稿加工のスタンプ）に macOS の Vision を使う
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSError", "NSObject", "NSString"] }
objc2-vision = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "objc2-core-graphics", "VNRequestHandler", "VNRequest", "VNDetectFaceRectanglesRequest", "VNDetectHorizonRequest", "VNRecognizeTextRequest", "VNObservation", "VNTypes"] }
